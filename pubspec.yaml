name: fishgram_app
description: "FishGram - Social Media App for Anglers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^15.1.2

  # HTTP / Networking
  http: ^1.3.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # UI Enhancements
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
