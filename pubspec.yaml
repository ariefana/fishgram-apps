name: fishgram_app
description: "FishGram - Social Media App for Anglers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.3.0
  google_identity_services_web: ^0.3.3
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  ionicons: ^0.2.2
  photo_view: ^0.15.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
